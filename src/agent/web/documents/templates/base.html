<!doctype html>
<html lang="ru" x-data x-bind:class="$store.theme.dark && 'dark'">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/documents/">
  <title>{% block title %}Документы · ai-local-agent{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    html { font-family: 'Inter', sans-serif; }
  </style>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('theme', {
        dark: localStorage.getItem('theme') === 'dark',
        toggle() {
          this.dark = !this.dark;
          localStorage.setItem('theme', this.dark ? 'dark' : 'light');
        }
      });
    });
  </script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased dark:bg-slate-900 dark:text-slate-100"
      x-data="toastManager()"
      @show-toast.window="show($event.detail.message, $event.detail.type || 'success')">

  {% block body %}{% endblock %}

  <!-- Toasts -->
  <div class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2 items-end pointer-events-none">
    <template x-for="t in toasts" :key="t.id">
      <div x-show="t.visible" x-transition
           class="pointer-events-auto flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm font-medium shadow-lg ring-1 backdrop-blur"
           :class="t.type === 'error'
                 ? 'bg-red-50/95 text-red-800 ring-red-200 dark:bg-red-900/40 dark:text-red-200 dark:ring-red-800'
                 : 'bg-white/95 text-stone-800 ring-stone-200 dark:bg-slate-800/95 dark:text-slate-100 dark:ring-slate-700'">
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>

  <script>
    function toastManager() {
      return {
        toasts: [], nextId: 1,
        show(message, type) {
          const id = this.nextId++;
          this.toasts.push({ id, message, type, visible: true });
          setTimeout(() => {
            const t = this.toasts.find(x => x.id === id);
            if (t) t.visible = false;
            setTimeout(() => { this.toasts = this.toasts.filter(x => x.id !== id); }, 250);
          }, 3000);
        }
      };
    }
  </script>
</body>
</html>
