{% extends "base.html" %}

{% block body %}
<div class="flex min-h-screen">
  <aside class="hidden w-64 shrink-0 border-r border-stone-200 bg-white/60 backdrop-blur-sm md:flex md:flex-col dark:border-slate-800 dark:bg-slate-900/60">
    <div class="flex h-16 items-center gap-2.5 border-b border-stone-200 px-5 dark:border-slate-800">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-emerald-500 to-teal-500 shadow-sm shadow-emerald-500/30">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
        </svg>
      </div>
      <span class="text-sm font-semibold tracking-tight">Документы</span>
    </div>
    <div class="p-3 space-y-1">
      <a href="#" class="flex items-center gap-2.5 rounded-lg bg-indigo-50 px-3 py-2 text-sm font-medium text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-300">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/>
        </svg>
        Все документы
      </a>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-stone-200 bg-stone-50/80 px-4 backdrop-blur-md md:px-8 dark:border-slate-800 dark:bg-slate-900/80">
      <h1 class="text-lg font-semibold tracking-tight">База знаний</h1>
      
      <div class="flex items-center gap-2">
        <button hx-post="api/reindex" hx-target="#doc-table" hx-indicator="#reindex-spinner"
                class="flex h-10 items-center gap-1.5 rounded-lg border border-stone-200 bg-white px-4 text-sm font-medium text-stone-700 shadow-sm transition hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
          <svg id="reindex-spinner" class="htmx-indicator h-4 w-4 animate-spin text-indigo-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <svg class="h-4 w-4 htmx-request:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span class="htmx-request:hidden">Обновить индекс</span>
        </button>

        <!-- Upload Form -->
        <form hx-post="api/upload" hx-encoding="multipart/form-data" hx-target="#doc-table" hx-indicator="#upload-spinner" class="relative">
          <input type="file" name="files" multiple required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="this.form.requestSubmit()">
          <button type="button" class="flex h-10 items-center gap-1.5 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 px-4 text-sm font-medium text-white shadow-sm shadow-indigo-500/30 transition hover:from-indigo-600 hover:to-violet-600">
            <svg id="upload-spinner" class="htmx-indicator h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <svg class="h-4 w-4 htmx-request:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            <span class="htmx-request:hidden">Загрузить</span>
          </button>
        </form>
      </div>
    </header>

    <main class="flex-1 p-4 md:p-8">
      <div id="doc-table" class="mx-auto max-w-5xl">
        {% include "partials/doc_table.html" %}
      </div>
    </main>
  </div>
</div>
{% endblock %}
