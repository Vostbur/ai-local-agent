<nav class="flex items-center gap-2 whitespace-nowrap">
  <a href="#"
     hx-get="/notes/api/notes"
     hx-vals='{"category": ""}'
     hx-include="[name='q']"
     hx-target="#notes-grid"
     hx-swap="innerHTML"
     onclick="document.getElementById('category-filter').value = '';"
     class="flex items-center rounded-full px-4 py-1.5 text-sm font-medium transition
            {% if not active_category %}bg-stone-900 text-white dark:bg-slate-100 dark:text-slate-900{% else %}bg-stone-100 text-stone-600 hover:bg-stone-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700{% endif %}">
    Все заметки
  </a>

  {% for cat in categories %}
    {% set c = category_color(cat.name) %}
    <a href="#"
       hx-get="/notes/api/notes"
       hx-vals='{"category": "{{ cat.name }}"}'
       hx-include="[name='q']"
       hx-target="#notes-grid"
       hx-swap="innerHTML"
       onclick="document.getElementById('category-filter').value = '{{ cat.name }}';"
       class="flex items-center gap-2 rounded-full border px-4 py-1.5 text-sm font-medium transition
              {% if active_category == cat.name %}bg-stone-900 text-white border-transparent dark:bg-slate-100 dark:text-slate-900{% else %}bg-white text-stone-600 border-stone-200 hover:bg-stone-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700{% endif %}">
      <span class="h-2 w-2 rounded-full" style="background: {{ c.fg }}"></span>
      {{ cat.name }}
      <span class="text-[11px] opacity-60">{{ cat.note_count }}</span>
    </a>
  {% endfor %}
</nav>
