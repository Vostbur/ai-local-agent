<div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-xl dark:border-slate-700 dark:bg-slate-800">
  <div class="mb-5 flex items-start justify-between">
    <div>
      <h2 class="text-lg font-semibold tracking-tight">
        {% if note %}Редактировать заметку{% else %}Новая заметка{% endif %}
      </h2>
      <p class="mt-0.5 text-xs text-stone-500 dark:text-slate-400">
        {% if note %}<span class="font-mono">{{ note.path }}</span>{% else %}Заполните поля и нажмите «Сохранить»{% endif %}
      </p>
    </div>
    <button type="button" @click="$dispatch('close-modal')"
            class="flex h-8 w-8 items-center justify-center rounded-lg text-stone-400 transition hover:bg-stone-100 hover:text-stone-600 dark:hover:bg-slate-700 dark:hover:text-slate-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form {% if note %}hx-put="api/notes?path={{ note.path|urlencode }}"{% else %}hx-post="api/notes"{% endif %}
        hx-target="#notes-grid"
        hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.successful) window.dispatchEvent(new CustomEvent('close-modal'))"
        class="space-y-4">
    <div>
      <label class="mb-1.5 block text-xs font-medium text-stone-700 dark:text-slate-300">Заголовок</label>
      <input type="text" name="title" required maxlength="200"
             value="{{ note.title if note else '' }}"
             placeholder="Например: Идеи для проекта"
             class="h-10 w-full rounded-lg border border-stone-200 bg-white px-3 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-900/60 dark:focus:border-indigo-500 dark:focus:ring-indigo-900/50">
    </div>

    <div>
      <label class="mb-1.5 block text-xs font-medium text-stone-700 dark:text-slate-300">Категория</label>
      <input type="text" name="category" list="cat-list"
             value="{{ (note.category or '') if note else '' }}"
             placeholder="general"
             class="h-10 w-full rounded-lg border border-stone-200 bg-white px-3 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-900/60 dark:focus:border-indigo-500 dark:focus:ring-indigo-900/50">
      <datalist id="cat-list">
        {% for cat in categories %}<option value="{{ cat }}">{% endfor %}
      </datalist>
    </div>

    <div>
      <label class="mb-1.5 block text-xs font-medium text-stone-700 dark:text-slate-300">Содержимое</label>
      <textarea name="content" rows="10"
                placeholder="Текст заметки…"
                class="w-full resize-none rounded-lg border border-stone-200 bg-white px-3 py-2 text-sm leading-relaxed outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-900/60 dark:focus:border-indigo-500 dark:focus:ring-indigo-900/50">{% if note %}{{ note.body if note.body is defined else note.preview }}{% endif %}</textarea>
    </div>

    <div class="flex items-center justify-end gap-2 pt-1">
      <button type="button" @click="$dispatch('close-modal')"
              class="h-9 rounded-lg border border-stone-200 bg-white px-4 text-sm font-medium text-stone-700 transition hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
        Отмена
      </button>
      <button type="submit"
              class="h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 px-4 text-sm font-medium text-white shadow-sm shadow-indigo-500/30 transition hover:from-indigo-600 hover:to-violet-600 active:scale-[0.98]">
        Сохранить
      </button>
    </div>
  </form>
</div>
