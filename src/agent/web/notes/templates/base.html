<!doctype html>
<html lang="ru" x-data x-bind:class="$store.theme.dark && 'dark'">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/notes/">
  <title>{% block title %}Заметки · ai-local-agent{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/app.css">
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('theme', {
        dark: localStorage.getItem('theme') === 'dark',
        toggle() {
          this.dark = !this.dark;
          localStorage.setItem('theme', this.dark ? 'dark' : 'light');
        }
      });
    });
  </script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased dark:bg-slate-900 dark:text-slate-100"
      x-data="toastManager()"
      @show-toast.window="show($event.detail.message, $event.detail.type || 'success')"
      @note-saved.window="show('Сохранено', 'success'); htmx.trigger('#sidebar', 'refresh')"
      @note-deleted.window="show('Удалено', 'success'); htmx.trigger('#sidebar', 'refresh')">

  {% block body %}{% endblock %}

  <div class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2 items-end pointer-events-none">
    <template x-for="t in toasts" :key="t.id">
      <div x-show="t.visible"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-y-3 scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 scale-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 translate-y-2"
           class="pointer-events-auto flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm font-medium shadow-lg ring-1 backdrop-blur"
           :class="t.type === 'error'
                 ? 'bg-red-50/95 text-red-800 ring-red-200 dark:bg-red-900/40 dark:text-red-200 dark:ring-red-800'
                 : 'bg-white/95 text-stone-800 ring-stone-200 dark:bg-slate-800/95 dark:text-slate-100 dark:ring-slate-700'">
        <svg x-show="t.type !== 'error'" class="h-4 w-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
        </svg>
        <svg x-show="t.type === 'error'" class="h-4 w-4 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
        </svg>
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>

  <script>
    function toastManager() {
      return {
        toasts: [], nextId: 1,
        show(message, type) {
          const id = this.nextId++;
          this.toasts.push({ id, message, type, visible: true });
          setTimeout(() => {
            const t = this.toasts.find(x => x.id === id);
            if (t) t.visible = false;
            setTimeout(() => { this.toasts = this.toasts.filter(x => x.id !== id); }, 250);
          }, 3000);
        }
      };
    }
  </script>
</body>
</html>
