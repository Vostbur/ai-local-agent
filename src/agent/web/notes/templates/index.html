{% extends "base.html" %}

{% block body %}
<div class="flex min-h-screen">
  <aside class="hidden w-64 shrink-0 border-r border-stone-200 bg-white/60 backdrop-blur-sm md:flex md:flex-col dark:border-slate-800 dark:bg-slate-900/60">
    <div class="flex h-16 items-center gap-2.5 border-b border-stone-200 px-5 dark:border-slate-800">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm shadow-indigo-500/30">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/>
        </svg>
      </div>
      <span class="text-sm font-semibold tracking-tight">Заметки</span>
    </div>
    <div id="sidebar"
         hx-get="api/notes/sidebar"
         hx-trigger="refresh"
         hx-swap="innerHTML"
         class="flex-1 overflow-y-auto p-3">
      {% include "partials/sidebar.html" %}
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-stone-200 bg-stone-50/80 px-4 backdrop-blur-md md:px-8 dark:border-slate-800 dark:bg-slate-900/80">
      <input type="hidden" name="category" id="category-filter" value="{{ active_category or '' }}">

      <div class="relative ml-auto w-full max-w-md">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <input type="search" name="q" placeholder="Поиск заметок…"
               class="h-10 w-full rounded-lg border border-stone-200 bg-white pl-9 pr-14 text-sm text-stone-900 placeholder-stone-400 shadow-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder-slate-500 dark:focus:border-indigo-500 dark:focus:ring-indigo-900/50"
               hx-get="api/notes"
               hx-trigger="input changed delay:300ms, search"
               hx-target="#notes-grid"
               hx-swap="innerHTML"
               hx-include="[name='category']">
        <kbd class="pointer-events-none absolute right-2.5 top-1/2 hidden -translate-y-1/2 rounded border border-stone-200 bg-stone-50 px-1.5 py-0.5 text-[10px] font-medium text-stone-400 sm:block dark:border-slate-700 dark:bg-slate-900 dark:text-slate-500">⌘K</kbd>
      </div>

      <button @click="$store.theme.toggle()" title="Тема"
              class="flex h-10 w-10 items-center justify-center rounded-lg border border-stone-200 bg-white text-stone-600 shadow-sm transition hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">
        <svg x-show="!$store.theme.dark" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
        </svg>
        <svg x-show="$store.theme.dark" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
        </svg>
      </button>

      <button hx-get="api/notes/form"
              hx-target="#modal-body"
              @click="$dispatch('open-modal')"
              class="flex h-10 items-center gap-1.5 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 px-4 text-sm font-medium text-white shadow-sm shadow-indigo-500/30 transition hover:from-indigo-600 hover:to-violet-600 active:scale-[0.98]">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
        </svg>
        <span class="hidden sm:inline">Новая</span>
      </button>
    </header>

    <main class="flex-1 p-4 md:p-8">
      <div id="notes-grid" class="mx-auto max-w-7xl">
        {% include "partials/notes_grid.html" %}
      </div>
    </main>
  </div>
</div>

<div x-data="{ open: false }"
     @open-modal.window="open = true"
     @close-modal.window="open = false"
     x-show="open" x-cloak
     @keydown.escape.window="open = false"
     class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm dark:bg-black/60"
       @click="open = false"></div>
  <div id="modal-body" x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 scale-95 translate-y-2"
       x-transition:enter-end="opacity-100 scale-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-95"
       class="relative w-full max-w-lg"></div>
</div>

<script>
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      document.querySelector('input[name="q"]')?.focus();
    }
  });
</script>
{% endblock %}
