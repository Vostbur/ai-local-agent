<div class="mx-auto max-w-4xl h-[calc(100vh-4rem)] flex flex-col">
  <!-- Заголовок и кнопка очистки -->
  <div class="mb-4 shrink-0 flex items-start justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Агент</h1>
    </div>
    <button type="button" onclick="window.clearChat()" class="flex items-center gap-1.5 rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-xs font-medium text-stone-600 shadow-sm transition hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
      Очистить чат
    </button>
  </div>

  <div id="chat-container" class="flex-1 rounded-xl border border-stone-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-800/50 flex flex-col overflow-hidden relative">
    <div id="chat-log" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 chat-scroll scroll-smooth">
      <!-- Приветственное сообщение -->
      <div id="welcome-message" class="flex gap-4">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm">
          <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
        </div>
        <div class="flex-1 space-y-2">
          <p class="text-sm font-medium text-stone-900 dark:text-slate-100">Привет! Чем я могу помочь?</p>
        </div>
      </div>
    </div>

    <!-- Поле ввода -->
    <div class="shrink-0 p-4 pb-6">
      <form id="agent-form" class="w-full" onsubmit="event.preventDefault(); window.submitAgent();">
        <div class="flex flex-col rounded-2xl bg-stone-100 dark:bg-slate-800 focus-within:ring-2 focus-within:ring-indigo-500/50 transition-shadow">
          <textarea id="agent-input" rows="1" placeholder="Напишите сообщение или задачу..."
                    class="w-full resize-none bg-transparent px-4 py-3 text-sm outline-none dark:text-slate-100"
                    oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"
                    onkeydown="window.handleKeyDown(event)"></textarea>
          
          <div class="flex items-center justify-between px-3 pb-2 pt-1">
            <div class="flex flex-wrap gap-1.5">
              <button type="button" onclick="window.fillInput('Найди в документах информацию про...')" class="rounded-lg border border-stone-200 bg-white px-2.5 py-1 text-[11px] text-stone-600 hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 transition">Поиск в документах</button>
              <button type="button" onclick="window.fillInput('Сохрани заметку о...')" class="rounded-lg border border-stone-200 bg-white px-2.5 py-1 text-[11px] text-stone-600 hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 transition">Создать заметку</button>
              <button type="button" onclick="window.fillInput('Сделай выжимку из документа...')" class="rounded-lg border border-stone-200 bg-white px-2.5 py-1 text-[11px] text-stone-600 hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 transition">Сделать выжимку</button>
            </div>
            
            <button type="submit" id="agent-submit-btn"
                    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-white shadow-sm transition hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18"/></svg>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>

<script>
(function() {
  // 1. Восстановление истории при загрузке
  const savedHistory = localStorage.getItem('agent_chat_history');
  const log = document.getElementById('chat-log');
  
  if (log) {
      Array.from(log.children).forEach(child => {
          if (child.id !== 'welcome-message') child.remove();
      });
      if (savedHistory) {
          log.insertAdjacentHTML('beforeend', savedHistory);
          log.scrollTop = log.scrollHeight;
      }
  }

  // 2. Проверка на активную задачу
  const activeTaskId = localStorage.getItem('agent_active_task');
  const activeTaskGoal = localStorage.getItem('agent_active_goal');
  
  if (activeTaskId && activeTaskGoal && log) {
      // Пользовательское сообщение уже есть в savedHistory (мы сохранили его при отправке)
      // Поэтому мы просто добавляем пузырь ассистента со статусом загрузки
      const assistantDiv = window.appendAssistantMessage();
      if (assistantDiv) {
          const input = document.getElementById('agent-input');
          const btn = document.getElementById('agent-submit-btn');
          if (input) input.disabled = true;
          if (btn) btn.disabled = true;
          window.startStream(activeTaskId, assistantDiv);
      }
  }

  window.clearChat = function() {
    localStorage.removeItem('agent_chat_history');
    localStorage.removeItem('agent_active_task');
    localStorage.removeItem('agent_active_goal');
    localStorage.removeItem('agent_start_time');
    const log = document.getElementById('chat-log');
    if (log) {
        Array.from(log.children).forEach(child => {
            if (child.id !== 'welcome-message') child.remove();
        });
    }
  };

  window.saveChatHistory = function() {
    try {
      const log = document.getElementById('chat-log');
      if (!log) return;

      const clone = log.cloneNode(true);
      const activeTask = localStorage.getItem('agent_active_task');

      if (activeTask) {
          // Если есть активная задача, удаляем ТОЛЬКО последний пузырь загрузки.
          // Сообщение пользователя оставляем, чтобы при перезагрузке оно не дублировалось.
          const msgs = clone.querySelectorAll('.flex.gap-4');
          for (let i = msgs.length - 1; i >= 0; i--) {
              const msg = msgs[i];
              const indicator = msg.querySelector('.typing-indicator');
              const content = msg.querySelector('.content');
              if (indicator && content && content.classList.contains('hidden')) {
                  msg.remove();
                  break;
              }
          }
      } else {
          // Обычная очистка от зависших индикаторов
          clone.querySelectorAll('.flex.gap-4').forEach(msg => {
              const indicator = msg.querySelector('.typing-indicator');
              const content = msg.querySelector('.content');
              if (indicator && content && content.classList.contains('hidden')) {
                  msg.remove();
              }
          });
      }

      const welcome = clone.querySelector('#welcome-message');
      if (welcome) welcome.remove();

      const messages = clone.querySelectorAll('.flex.gap-4');
      if (messages.length > 20) {
        for (let i = 0; i < messages.length - 20; i++) {
          messages[i].remove();
        }
      }

      let html = clone.innerHTML;
      if (typeof DOMPurify !== 'undefined') {
        html = DOMPurify.sanitize(html);
      } else {
        html = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
      }
      localStorage.setItem('agent_chat_history', html);
    } catch (e) {
      console.error('Ошибка сохранения истории', e);
    }
  };

  window.fillInput = function(text) {
    const input = document.getElementById('agent-input');
    if (!input) return;
    input.value = text;
    input.focus();
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };

  window.handleKeyDown = function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      window.submitAgent();
    }
  };

  window.appendUserMessage = function(text) {
    const log = document.getElementById('chat-log');
    if (!log) return;
    const div = document.createElement('div');
    div.className = 'flex gap-4 flex-row-reverse';
    div.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-stone-200 text-stone-600 dark:bg-slate-700 dark:text-slate-300">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      </div>
      <div class="flex-1 max-w-[80%] rounded-2xl rounded-tr-sm bg-indigo-600 px-4 py-3 text-sm text-white shadow-sm whitespace-pre-wrap">${escapeHtml(text)}</div>
    `;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  };

  window.appendAssistantMessage = function() {
    const log = document.getElementById('chat-log');
    if (!log) return null;
    const div = document.createElement('div');
    div.className = 'flex gap-4';
    div.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
      </div>
      <div class="flex-1 max-w-[85%] rounded-2xl rounded-tl-sm bg-stone-100 px-4 py-3 text-sm text-stone-800 shadow-sm dark:bg-slate-800 dark:text-slate-200">
        <div class="prose prose-sm dark:prose-invert max-w-none break-words">
          <div class="typing-indicator flex items-center gap-2 h-5 text-xs text-stone-500 dark:text-slate-400">
            <div class="flex items-center gap-1">
              <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
              <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
              <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
            </div>
            <span class="status-text animate-pulse"></span>
          </div>
          <div class="content hidden"></div>
        </div>
      </div>
    `;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  };

  window.escapeHtml = function(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  window.startStream = async function(taskId, assistantDiv) {
    const typingIndicator = assistantDiv.querySelector('.typing-indicator');
    const statusText = assistantDiv.querySelector('.status-text');
    const contentDiv = assistantDiv.querySelector('.content');
    
    // Берем время старта из localStorage, чтобы не сбрасывать его при переключении вкладок
    let startTime = parseInt(localStorage.getItem('agent_start_time') || '0');
    if (!startTime) {
        startTime = Date.now();
        localStorage.setItem('agent_start_time', startTime);
    }

    statusText.textContent = 'Агент думает...';
    const timerInterval = setInterval(() => {
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const mins = Math.floor(elapsedSeconds / 60);
        const secs = elapsedSeconds % 60;
        statusText.textContent = `Агент думает... ${mins > 0 ? mins + 'м ' : ''}${secs}с`;
    }, 1000);

    let fullText = '';
    let isFirstChunk = true;
    const chatLog = document.getElementById('chat-log');
    
    try {
      const streamRes = await fetch(`/stream/${taskId}`);
      if (!streamRes.ok) {
          localStorage.removeItem('agent_active_task');
          localStorage.removeItem('agent_active_goal');
          localStorage.removeItem('agent_start_time');
          throw new Error('Сессия потеряна. Пожалуйста, отправьте запрос заново.');
      }
      
      const reader = streamRes.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split(/\r?\n\r?\n/);
        buffer = parts.pop();

        for (const part of parts) {
            const lines = part.split(/\r?\n/);
            let dataStr = '';
            for (const line of lines) {
                if (line.startsWith('event:')) continue;
                if (line.startsWith('data:')) dataStr += line.substring(5).trim();
                else if (line.startsWith('{')) dataStr += line.trim();
            }
            if (!dataStr) continue;

            try {
                const payload = JSON.parse(dataStr);
                if (payload.type === 'step') {
                    if (payload.event_type === 'tool_result') statusText.textContent = `Выполнено: ${payload.tool_name} (${payload.count || 0})`;
                    else if (payload.event_type === 'llm_call') statusText.textContent = 'Агент думает...';
                    else if (payload.event_type === 'final') statusText.textContent = 'Формирую ответ...';
                }
                else if (payload.type === 'final') {
                    if (isFirstChunk) {
                        typingIndicator.classList.add('hidden');
                        contentDiv.classList.remove('hidden');
                        isFirstChunk = false;
                    }
                    if (payload.final_answer) {
                        fullText = payload.final_answer;
                        contentDiv.innerHTML = typeof DOMPurify !== 'undefined' 
                            ? DOMPurify.sanitize(marked.parse(fullText)) 
                            : marked.parse(fullText);
                        if (chatLog) chatLog.scrollTop = chatLog.scrollHeight;
                    }
                }
            } catch (e) {
                console.warn("Skipped non-JSON SSE line:", dataStr);
            }
        }
      }
    } catch (err) {
      console.error(err);
      if (isFirstChunk) {
          typingIndicator.classList.add('hidden');
          contentDiv.classList.remove('hidden');
      }
      contentDiv.innerHTML += `<br><span class="text-red-500">Ошибка: ${err.message}</span>`;
    } finally {
      clearInterval(timerInterval);
      if (isFirstChunk) {
          typingIndicator.classList.add('hidden');
          contentDiv.classList.remove('hidden');
          contentDiv.innerHTML = '<span class="text-stone-400 italic">Агент завершил работу без текстового ответа.</span>';
      }
      localStorage.removeItem('agent_active_task');
      localStorage.removeItem('agent_active_goal');
      localStorage.removeItem('agent_start_time');
      window.saveChatHistory();
      
      const input = document.getElementById('agent-input');
      const btn = document.getElementById('agent-submit-btn');
      if (input) { input.disabled = false; input.focus(); }
      if (btn) btn.disabled = false;
    }
  };

  window.submitAgent = async function() {
    const input = document.getElementById('agent-input');
    const btn = document.getElementById('agent-submit-btn');
    if (!input || !btn || input.disabled) return;
    
    const goal = input.value.trim();
    if (!goal) return;

    input.value = '';
    input.style.height = '';
    input.disabled = true;
    btn.disabled = true;
    
    window.appendUserMessage(goal);
    const assistantDiv = window.appendAssistantMessage();
    if (!assistantDiv) return;
    
    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal })
      });
      
      if (!res.ok) throw new Error('Ошибка при запуске агента');
      const data = await res.json();
      
      // Сохраняем состояние активной задачи и историю
      localStorage.setItem('agent_active_task', data.task_id);
      localStorage.setItem('agent_active_goal', goal);
      window.saveChatHistory();
      
      window.startStream(data.task_id, assistantDiv);
      
    } catch (err) {
      console.error(err);
      const contentDiv = assistantDiv.querySelector('.content');
      const typingIndicator = assistantDiv.querySelector('.typing-indicator');
      if (typingIndicator) typingIndicator.classList.add('hidden');
      if (contentDiv) {
          contentDiv.classList.remove('hidden');
          contentDiv.innerHTML = `<span class="text-red-500">Ошибка: ${err.message}</span>`;
      }
      window.saveChatHistory();
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    }
  };
})();
</script>
