<div class="mx-auto max-w-4xl h-[calc(100vh-4rem)] flex flex-col">
  <!-- Заголовок -->
  <div class="mb-4 shrink-0">
    <h1 class="text-2xl font-bold tracking-tight">Агент</h1>
    <p class="text-sm text-stone-500 dark:text-slate-400 mt-1">Задайте цель. Он может искать по документам, читать и создавать файлы.</p>
  </div>

  <!-- Область чата -->
  <div id="chat-container" class="flex-1 rounded-xl border border-stone-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-800/50 flex flex-col overflow-hidden relative">
    
    <div id="chat-log" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 chat-scroll scroll-smooth">
      <!-- Приветственное сообщение -->
      <div class="flex gap-4">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm">
          <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
        </div>
        <div class="flex-1 space-y-2">
          <p class="text-sm font-medium text-stone-900 dark:text-slate-100">Привет! Чем я могу помочь?</p>
          <div class="flex flex-wrap gap-2 mt-2">
            <button onclick="fillInput('Найди в документах информацию про...')" class="rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs text-stone-600 hover:bg-stone-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition">Поиск в документах</button>
            <button onclick="fillInput('Сохрани заметку о...')" class="rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs text-stone-600 hover:bg-stone-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition">Создать заметку</button>
            <button onclick="fillInput('Сделай выжимку из документа...')" class="rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs text-stone-600 hover:bg-stone-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition">Сделать выжимку</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Поле ввода -->
    <div class="shrink-0 border-t border-stone-200 bg-stone-50/50 p-4 dark:border-slate-700/50 dark:bg-slate-800/30">
      <form id="agent-form" class="relative max-w-3xl mx-auto" onsubmit="event.preventDefault(); submitAgent();">
        <textarea id="agent-input" rows="1" placeholder="Напишите сообщение или задачу..."
                  class="w-full resize-none rounded-xl border border-stone-200 bg-white px-4 py-3 pr-12 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-600 dark:bg-slate-900/80 dark:text-slate-100 dark:focus:border-indigo-500 dark:focus:ring-indigo-900/50"
                  oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
        <button type="submit" id="agent-submit-btn"
                class="absolute bottom-2 right-2 flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white shadow-sm transition hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  // Автоматическое изменение высоты textarea
  document.getElementById('agent-input').addEventListener('input', function() {
    this.style.height = '';
    this.style.height = this.scrollHeight + 'px';
  });

  function fillInput(text) {
    const input = document.getElementById('agent-input');
    input.value = text;
    input.focus();
  }

  function appendUserMessage(text) {
    const log = document.getElementById('chat-log');
    const div = document.createElement('div');
    div.className = 'flex gap-4 flex-row-reverse';
    div.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-stone-200 text-stone-600 dark:bg-slate-700 dark:text-slate-300">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      </div>
      <div class="flex-1 max-w-[80%] rounded-2xl rounded-tr-sm bg-indigo-600 px-4 py-3 text-sm text-white shadow-sm whitespace-pre-wrap">${escapeHtml(text)}</div>
    `;
    log.appendChild(div);
    scrollToBottom();
  }

  function appendAssistantMessage() {
    const log = document.getElementById('chat-log');
    const div = document.createElement('div');
    div.className = 'flex gap-4';
    div.id = 'assistant-msg-' + Date.now();
    div.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
      </div>
      <div class="flex-1 max-w-[85%] rounded-2xl rounded-tl-sm bg-stone-100 px-4 py-3 text-sm text-stone-800 shadow-sm dark:bg-slate-800 dark:text-slate-200">
        <div class="prose prose-sm dark:prose-invert max-w-none break-words">
          <div class="typing-indicator flex items-center gap-1 h-5">
            <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
            <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
            <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
          </div>
          <div class="content hidden"></div>
        </div>
      </div>
    `;
    log.appendChild(div);
    scrollToBottom();
    return div;
  }

  function scrollToBottom() {
    const log = document.getElementById('chat-log');
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function submitAgent() {
    const input = document.getElementById('agent-input');
    const btn = document.getElementById('agent-submit-btn');
    const goal = input.value.trim();
    if (!goal) return;

    // UI: очистка, блокировка, добавление сообщения пользователя
    input.value = '';
    input.style.height = '';
    input.disabled = true;
    btn.disabled = true;
    
    appendUserMessage(goal);
    const assistantDiv = appendAssistantMessage();
    const typingIndicator = assistantDiv.querySelector('.typing-indicator');
    const contentDiv = assistantDiv.querySelector('.content');
    
    let fullText = '';
    
    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal })
      });
      
      if (!res.ok) throw new Error('Ошибка при запуске агента');
      const data = await res.json();
      
      // Подключаемся к SSE
      const es = new EventSource(`/stream/${data.task_id}`);
      
      es.onmessage = (event) => {
        typingIndicator.classList.add('hidden');
        contentDiv.classList.remove('hidden');
        
        try {
          const payload = JSON.parse(event.data);
          // Если бэкенд присылает структурированные события
          if (payload.text) {
             fullText += payload.text + "\n";
          } else if (payload.content) {
             fullText += payload.content + "\n";
          } else if (typeof payload === 'string') {
             fullText += payload;
          }
        } catch (e) {
          // Если бэкенд присылает просто текст
          fullText += event.data;
        }
        
        // Рендерим Markdown
        contentDiv.innerHTML = marked.parse(fullText);
        scrollToBottom();
      };
      
      es.addEventListener('close', () => {
        es.close();
        input.disabled = false;
        btn.disabled = false;
        input.focus();
        typingIndicator.classList.add('hidden');
        if (!fullText) {
          contentDiv.classList.remove('hidden');
          contentDiv.innerHTML = '<span class="text-stone-400 italic">Агент завершил работу без текстового ответа.</span>';
        }
      });
      
      es.onerror = (err) => {
        console.error("SSE Error:", err);
        es.close();
        input.disabled = false;
        btn.disabled = false;
        typingIndicator.classList.add('hidden');
        contentDiv.classList.remove('hidden');
        contentDiv.innerHTML += '<br><span class="text-red-500">Соединение прервано.</span>';
      };
      
    } catch (err) {
      typingIndicator.classList.add('hidden');
      contentDiv.classList.remove('hidden');
      contentDiv.innerHTML = `<span class="text-red-500">Ошибка: ${err.message}</span>`;
      input.disabled = false;
      btn.disabled = false;
    }
  }
</script>
