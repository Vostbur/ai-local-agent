<div class="mx-auto max-w-4xl h-[calc(100vh-4rem)] flex flex-col">
  <!-- Заголовок и кнопка очистки -->
  <div class="mb-4 shrink-0 flex items-start justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Агент</h1>
      <p class="text-sm text-stone-500 dark:text-slate-400 mt-1">Задайте цель. Он может искать по документам, читать и создавать файлы.</p>
    </div>
    <button type="button" onclick="window.clearChat()" class="flex items-center gap-1.5 rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-xs font-medium text-stone-600 shadow-sm transition hover:bg-stone-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
      Очистить чат
    </button>
  </div>

  <div id="chat-container" class="flex-1 rounded-xl border border-stone-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-800/50 flex flex-col overflow-hidden relative">
    <div id="chat-log" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 chat-scroll scroll-smooth">
      <!-- Приветственное сообщение -->
      <div id="welcome-message" class="flex gap-4 hidden">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm">
          <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
        </div>
        <div class="flex-1 space-y-2">
          <p class="text-sm font-medium text-stone-900 dark:text-slate-100">Привет! Чем я могу помочь?</p>
          <div class="flex flex-wrap gap-2 mt-2">
            <button type="button" onclick="fillInput('Найди в документах информацию про...')" class="rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs text-stone-600 hover:bg-stone-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition">Поиск в документах</button>
            <button type="button" onclick="fillInput('Сохрани заметку о...')" class="rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs text-stone-600 hover:bg-stone-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition">Создать заметку</button>
            <button type="button" onclick="fillInput('Сделай выжимку из документа...')" class="rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs text-stone-600 hover:bg-stone-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition">Сделать выжимку</button>
          </div>
        </div>
      </div>
    </div>

    <div class="shrink-0 border-t border-stone-200 bg-stone-50/50 p-4 dark:border-slate-700/50 dark:bg-slate-800/30">
      <form id="agent-form" class="relative max-w-3xl mx-auto" onsubmit="event.preventDefault(); submitAgent();">
        <textarea id="agent-input" rows="1" placeholder="Напишите сообщение или задачу..."
                  class="w-full resize-none rounded-xl border border-stone-200 bg-white px-4 py-3 pr-14 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-600 dark:bg-slate-900/80 dark:text-slate-100 dark:focus:border-indigo-500 dark:focus:ring-indigo-900/50"
                  oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
        <button type="submit" id="agent-submit-btn"
                class="absolute bottom-2.5 right-2.5 flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white shadow-sm transition hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
(function() {
  const savedHistory = localStorage.getItem('agent_chat_history');
  if (savedHistory) {
    document.getElementById('welcome-message').classList.add('hidden');
    const log = document.getElementById('chat-log');
    if (log) {
        log.innerHTML = savedHistory;
        log.scrollTop = log.scrollHeight;
    }
  } else {
    document.getElementById('welcome-message').classList.remove('hidden');
  }

  window.clearChat = function() {
    localStorage.removeItem('agent_chat_history');
    const log = document.getElementById('chat-log');
    if (log) log.innerHTML = '';
    
    const welcome = document.getElementById('welcome-message');
    if (welcome) {
        welcome.classList.remove('hidden');
        log.appendChild(welcome);
    }
  };

  window.saveChatHistory = function() {
    try {
      const log = document.getElementById('chat-log');
      if (log) {
        const clone = log.cloneNode(true);
        const typing = clone.querySelector('.typing-indicator');
        if (typing && typing.closest('.flex.gap-4')) typing.closest('.flex.gap-4').remove(); 
        
        const welcome = clone.querySelector('#welcome-message');
        const messages = clone.querySelectorAll('.flex.gap-4:not(#welcome-message)');
        
        if (messages.length > 0 && welcome) {
            welcome.remove();
        }
        
        if (messages.length > 20) {
            for (let i = 0; i < messages.length - 20; i++) {
                messages[i].remove();
            }
        }
        
        let html = clone.innerHTML;
        if (typeof DOMPurify !== 'undefined') {
            html = DOMPurify.sanitize(html);
        } else {
            html = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
        }
        localStorage.setItem('agent_chat_history', html);
      }
    } catch (e) {
      console.error('Ошибка сохранения истории', e);
    }
  };

  window.fillInput = function(text) {
    const input = document.getElementById('agent-input');
    if (!input) return;
    input.value = text;
    input.focus();
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };

  window.appendUserMessage = function(text) {
    const log = document.getElementById('chat-log');
    if (!log) return;
    
    const welcome = document.getElementById('welcome-message');
    if (welcome) welcome.classList.add('hidden');

    const div = document.createElement('div');
    div.className = 'flex gap-4 flex-row-reverse';
    div.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-stone-200 text-stone-600 dark:bg-slate-700 dark:text-slate-300">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      </div>
      <div class="flex-1 max-w-[80%] rounded-2xl rounded-tr-sm bg-indigo-600 px-4 py-3 text-sm text-white shadow-sm whitespace-pre-wrap">${escapeHtml(text)}</div>
    `;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    window.saveChatHistory();
  };

  window.appendAssistantMessage = function() {
    const log = document.getElementById('chat-log');
    if (!log) return null;
    const div = document.createElement('div');
    div.className = 'flex gap-4';
    div.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
      </div>
      <div class="flex-1 max-w-[85%] rounded-2xl rounded-tl-sm bg-stone-100 px-4 py-3 text-sm text-stone-800 shadow-sm dark:bg-slate-800 dark:text-slate-200">
        <div class="prose prose-sm dark:prose-invert max-w-none break-words">
          <div class="typing-indicator flex items-center gap-2 h-5 text-xs text-stone-500 dark:text-slate-400">
            <div class="flex items-center gap-1">
              <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
              <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
              <span class="dot h-1.5 w-1.5 rounded-full bg-stone-500 dark:bg-slate-400"></span>
            </div>
            <span class="status-text animate-pulse"></span>
          </div>
          <div class="content hidden"></div>
        </div>
      </div>
    `;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  };

  window.escapeHtml = function(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  window.submitAgent = async function() {
    const input = document.getElementById('agent-input');
    const btn = document.getElementById('agent-submit-btn');
    if (!input || !btn) return;
    
    const goal = input.value.trim();
    if (!goal) return;

    input.value = '';
    input.style.height = '';
    input.disabled = true;
    btn.disabled = true;
    
    window.appendUserMessage(goal);
    const assistantDiv = window.appendAssistantMessage();
    if (!assistantDiv) return;
    
    const typingIndicator = assistantDiv.querySelector('.typing-indicator');
    const statusText = assistantDiv.querySelector('.status-text');
    const contentDiv = assistantDiv.querySelector('.content');
    
    let fullText = '';
    let isFirstChunk = true;
    const chatLog = document.getElementById('chat-log');
    
    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal })
      });
      
      if (!res.ok) throw new Error('Ошибка при запуске агента');
      const data = await res.json();
      
      const streamRes = await fetch(`/stream/${data.task_id}`);
      if (!streamRes.ok) throw new Error('Ошибка стрима');
      
      const reader = streamRes.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop();

        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('event:')) continue;

            try {
                const payload = JSON.parse(trimmed);

                if (payload.type === 'step') {
                    // Показываем прогресс в индикаторе
                    if (payload.event_type === 'tool_result') {
                        statusText.textContent = `Выполнено: ${payload.tool_name} (${payload.count || 0})`;
                    } else if (payload.event_type === 'llm_call') {
                        statusText.textContent = 'Агент думает...';
                    } else if (payload.event_type === 'final') {
                        statusText.textContent = 'Формирую ответ...';
                    }
                }
                else if (payload.type === 'final') {
                    if (isFirstChunk) {
                        typingIndicator.classList.add('hidden');
                        contentDiv.classList.remove('hidden');
                        isFirstChunk = false;
                    }

                    if (payload.final_answer) {
                        fullText = payload.final_answer;
                        contentDiv.innerHTML = typeof DOMPurify !== 'undefined' 
                            ? DOMPurify.sanitize(marked.parse(fullText)) 
                            : marked.parse(fullText);
                        if (chatLog) chatLog.scrollTop = chatLog.scrollHeight;
                    }
                }
            } catch (e) {
                // Пропускаем строки, которые не являются валидным JSON
                console.warn("Skipped non-JSON SSE line:", trimmed);
            }
        }
      }
      
    } catch (err) {
      console.error(err);
      if (isFirstChunk) {
          typingIndicator.classList.add('hidden');
          contentDiv.classList.remove('hidden');
      }
      contentDiv.innerHTML += `<br><span class="text-red-500">Ошибка: ${err.message}</span>`;
    } finally {
      if (isFirstChunk) {
          typingIndicator.classList.add('hidden');
          contentDiv.classList.remove('hidden');
          contentDiv.innerHTML = '<span class="text-stone-400 italic">Агент завершил работу без текстового ответа.</span>';
      }
      window.saveChatHistory();
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    }
  };
})();
</script>
