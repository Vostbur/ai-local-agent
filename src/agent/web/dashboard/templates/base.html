<!doctype html>
<html lang="ru" x-data x-bind:class="$store.theme.dark && 'dark'">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-local-agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    html { font-family: 'Inter', sans-serif; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request .htmx-request\:hidden { display: none !important; }
  </style>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('theme', {
        dark: localStorage.getItem('theme') === 'dark',
        toggle() {
          this.dark = !this.dark;
          localStorage.setItem('theme', this.dark ? 'dark' : 'light');
        }
      });
    });
  </script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased dark:bg-slate-900 dark:text-slate-100"
      x-data="toastManager()"
      @show-toast.window="show($event.detail.message, $event.detail.type || 'success')"
      @note-saved.window="show('Заметка сохранена', 'success'); htmx.trigger('#sidebar-refresh-trigger', 'refresh')"
      @note-deleted.window="show('Заметка удалена', 'success'); htmx.trigger('#sidebar-refresh-trigger', 'refresh')">

<div class="flex min-h-screen">
  <!-- Общий Sidebar -->
  <aside class="hidden w-64 shrink-0 border-r border-stone-200 bg-white/60 backdrop-blur-sm md:flex md:flex-col dark:border-slate-800 dark:bg-slate-900/60">
    <div class="flex h-16 items-center gap-2.5 border-b border-stone-200 px-5 dark:border-slate-800">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 shadow-sm shadow-indigo-500/30">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/>
        </svg>
      </div>
      <span class="text-sm font-semibold tracking-tight">ai-local-agent</span>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-1">
      <!-- Навигация -->
      <button hx-get="/dashboard/views/agent" hx-target="#view-container" hx-swap="innerHTML"
              class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-stone-600 transition hover:bg-stone-100 dark:text-slate-300 dark:hover:bg-slate-800 [&.active]:bg-indigo-50 [&.active]:text-indigo-700 dark:[&.active]:bg-indigo-500/10 dark:[&.active]:text-indigo-300"
              onclick="setActive(this)">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        Агент
      </button>
      <button hx-get="/dashboard/views/notes" hx-target="#view-container" hx-swap="innerHTML"
              class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-stone-600 transition hover:bg-stone-100 dark:text-slate-300 dark:hover:bg-slate-800 [&.active]:bg-indigo-50 [&.active]:text-indigo-700 dark:[&.active]:bg-indigo-500/10 dark:[&.active]:text-indigo-300"
              onclick="setActive(this)">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>
        Заметки
      </button>
      <button hx-get="/dashboard/views/docs" hx-target="#view-container" hx-swap="innerHTML"
              class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-stone-600 transition hover:bg-stone-100 dark:text-slate-300 dark:hover:bg-slate-800 [&.active]:bg-indigo-50 [&.active]:text-indigo-700 dark:[&.active]:bg-indigo-500/10 dark:[&.active]:text-indigo-300"
              onclick="setActive(this)">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/></svg>
        Документы
      </button>
    </div>
    
    <!-- Переключатель темы внизу сайдбара -->
    <div class="p-3 border-t border-stone-200 dark:border-slate-800">
      <button @click="$store.theme.toggle()" class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-stone-600 transition hover:bg-stone-100 dark:text-slate-300 dark:hover:bg-slate-800">
        <svg x-show="!$store.theme.dark" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
        <svg x-show="$store.theme.dark" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
        Сменить тему
      </button>
    </div>
  </aside>

  <!-- Правая часть (Контент) -->
  <div class="flex min-w-0 flex-1 flex-col">
    <div id="view-container" class="flex-1 p-4 md:p-8">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2 items-end pointer-events-none">
  <template x-for="t in toasts" :key="t.id">
    <div x-show="t.visible" x-transition
         class="pointer-events-auto flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm font-medium shadow-lg ring-1 backdrop-blur"
         :class="t.type === 'error' ? 'bg-red-50/95 text-red-800 ring-red-200 dark:bg-red-900/40 dark:text-red-200 dark:ring-red-800' : 'bg-white/95 text-stone-800 ring-stone-200 dark:bg-slate-800/95 dark:text-slate-100 dark:ring-slate-700'">
      <span x-text="t.message"></span>
    </div>
  </template>
</div>

<!-- Модалка (общая для заметок) -->
<div x-data="{ open: false }" @open-modal.window="open = true" @close-modal.window="open = false" x-show="open" x-cloak @keydown.escape.window="open = false" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div x-show="open" x-transition.opacity class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm dark:bg-black/60" @click="open = false"></div>
  <div id="modal-body" x-show="open" x-transition class="relative w-full max-w-lg"></div>
</div>

<div id="sidebar-refresh-trigger" hx-get="/dashboard/views/notes/sidebar" hx-trigger="refresh" hx-swap="none"></div>

<script>
  function toastManager() {
    return {
      toasts: [], nextId: 1,
      show(message, type) {
        const id = this.nextId++;
        this.toasts.push({ id, message, type, visible: true });
        setTimeout(() => {
          const t = this.toasts.find(x => x.id === id);
          if (t) t.visible = false;
          setTimeout(() => { this.toasts = this.toasts.filter(x => x.id !== id); }, 250);
        }, 3000);
      }
    };
  }
  
  function setActive(el) {
    document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('aside button').classList.add('active');
  });
</script>
</body>
</html>
