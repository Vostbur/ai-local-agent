[llm]
# Без тега :latest — Ollama применит его автоматически.
# 7B — рекомендуется (лучше routing). 3B — быстрее, но путает инструменты.
model = "qwen2.5-7b-agent"
base_url = "http://localhost:11434"
max_steps = 10
# Опционально: если не указать — Ollama применит свои дефолты.
# Для tool calling на 3B-модели обычно лучше низкая температура.
# temperature = 0.3
# max_tokens = 1024

[paths]
# Относительные пути резолвятся от корня проекта, а не от текущей папки.
data_dir = "data"
notes_dir = "data/notes"
# Корзина для удалённых заметок/документов (этап B/C). Файлы перемещаются сюда,
# а не удаляются физически.
trash_dir = "data/trash"
inbox_dir = "data/inbox"
photos_dir = "data/photos"
# Корень корпуса документов для RAG. Относительный путь — от корня проекта.
documents_dir = "data/documents"
# Корень векторного индекса для RAG. Относительный путь — от корня проекта.
index_dir = "data/index"
# Директория для документов, созданных агентом по шаблону.
generated_dir = "data/generated"

logs_dir = "logs"

[safety]
# Логика подтверждения файловых операций появится в шаге 8 (move_file).
# Пока поле читается, но не используется.
# confirm_file_operations = true

# Сколько раз оркестратор повторит падающий вызов инструмента, прежде чем сдаться.
max_tool_retries = 2

[rag]
# Модель эмбеддингов. Мультиязычная (русский + английский).
# 768-dim, лучше на русском, чем MiniLM-L12.
# Альтернативы: "intfloat/multilingual-e5-small"
embedding_model = "paraphrase-multilingual-mpnet-base-v2"
# Размер чанка в символах. ~200 токенов — хорошо для 3B с контекстом 8K.
chunk_size = 400
# Перекрытие соседних чанков, чтобы не рвать мысль на границе.
chunk_overlap = 100
# Сколько чанков возвращать в search_documents (пока не используется, для 7.2).
top_k = 5