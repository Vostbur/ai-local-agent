[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-local-agent"
version = "0.1.0"
description = "Local AI agent for everyday tasks"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent.web" = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/**/*",
]
"agent.web.notes" = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/css/*.css",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]