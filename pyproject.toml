[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-local-agent"
version = "0.1.0"
description = "Local AI agent for everyday tasks"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
